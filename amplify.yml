version: 1
frontend:
  phases:
    preBuild:
      commands:
        - sh -c 'cd frontend && npm ci'
    build:
      commands:
        - sh -c 'cd frontend && npm run build'
  artifacts:
    baseDirectory: frontend/.next
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
