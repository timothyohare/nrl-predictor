version: 1
frontend:
  phases:
    preBuild:
      commands:
        - sh -c 'cd frontend && npm ci'
    build:
      commands:
        - sh -c 'cd frontend && npm run build'
        - bash scripts/build-amplify.sh
  artifacts:
    baseDirectory: frontend/.amplify-hosting
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
