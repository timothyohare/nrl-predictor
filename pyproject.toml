[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nrl-predictor"
version = "0.1.0"
requires-python = ">=3.12"
# Union of v1 + v2 runtime deps (monorepo serves both fleets).
dependencies = [
    "requests>=2.32",
    "boto3>=1.34",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "anthropic>=0.28",
    "langchain-anthropic>=1.4",
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "tavily-python>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-bdd>=7.3",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "moto[dynamodb,s3,secretsmanager]>=5.0",
    "aws-cdk-lib>=2.140",
    "constructs>=10.3",
    "ruff>=0.6",
    "mypy>=1.10",
    "mutmut>=3.6",
]
viz = [
    # v2 dashboard (v2/tools/dashboard.py). Not needed for agents or tests.
    "streamlit>=1.40",
    "pandas>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
# Shared at root (common/scrapers/scoring); version trees under v1*/v2*.
include = ["common*", "scrapers*", "scoring*", "v1*", "v2*"]
exclude = ["tests*", "v1.tests*", "v2.tests*"]

[tool.mutmut]
# Mutation pilot (CHG-0027): pure shared modules with fast, self-contained unit
# tests. Verdict + Stryker-schema report come from scripts/gate/mutation_gate.py
# (bound as `mutation` in .claude/harness.json); mutmut is the mutation engine.
source_paths = ["common", "scoring"]
only_mutate = [
    "common/match_id.py",
    "common/teams.py",
    "common/predictions.py",
    "scoring/scorer.py",
]
pytest_add_cli_args_test_selection = [
    "tests/common",
    "tests/scoring/test_scorer.py",
]
also_copy = ["common/team_registry.json"]
# mutmut's CST pragma visitor misses comments inside call-argument lists; this
# line-regex fallback makes `# pragma: no mutate` effective anywhere it appears.
do_not_mutate_patterns = ['pragma: no mutate']

[tool.pytest.ini_options]
# Both suites run from one rootdir. importlib mode avoids sys.path insertion and
# duplicate-basename collisions across the tests/ and v2/tests/ trees, and ensures
# bare `from scrapers/common/scoring` resolve to the ROOT copies (via the editable
# install), not the v2/ duplicates.
# pythonpath=["."] puts the repo root on sys.path so root-level, non-installed
# modules (`scripts/`, not in packages.find) resolve under plain `pytest` too —
# importlib mode doesn't add rootdir itself, so without this CI (`pytest`) fails
# `from scripts...` even though local `python -m pytest` (adds cwd) passed.
testpaths = ["tests", "v2/tests"]
pythonpath = ["."]
addopts = "-v --import-mode=importlib --cov --cov-report=term-missing --cov-fail-under=93"

[tool.coverage.run]
branch = true
# v1 + the shared root packages. v2 has its own suite and is out of scope for this
# floor (docs/plans/12-test-coverage-hardening.md). Running v2/tests still
# contributes coverage to the shared packages, which only helps.
source = ["common", "scrapers", "scoring", "v1"]
omit = [
    "*/__main__.py",
    "v2/*",
    "tests/*",
    "v2/tests/*",
    "scripts/*",
    "infra/*",
    "fetcher-spikes/*",
]

[tool.coverage.report]
show_missing = true
# Achieved 96% line / 96% branch across phases 1-7 (see plan 12). Floor is 93 — a
# ~3pt buffer so an ordinary change doesn't red the gate, low enough to catch a
# real regression. Ratchet up as the remaining sub-90 files (v1/agent/*,
# v1/retrospective/*, v1/orchestrator/lambda_handler.py, scrapers/articles/body.py,
# scrapers/nrl/team_sheet.py) get covered. Never lower it to make a run pass.
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["infra/cdk.out", "v2/infra/cdk.out", "fetcher-spikes", ".venv", "mutants"]

[tool.ruff.lint]
# Pragmatic default set: pyflakes (F), pycodestyle errors (E), import sorting (I),
# pep8-naming (N), pyupgrade (UP), flake8-bugbear (B), comprehensions (C4).
select = ["F", "E", "I", "N", "UP", "B", "C4"]
# E501 (line too long) is handled by the formatter; N818 would force renaming
# established public exception classes (BudgetExceeded, TeamSheetNotFound, …) —
# an invasive API change not worth a naming rule.
ignore = ["E501", "N818"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# Lenient baseline: enforce correctness on annotated code without demanding
# annotations everywhere. Tighten incrementally.
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
# Both v1 and v2 version code + shared root are type-checked. Tests and infra
# (CDK) are excluded for both fleets, matching the lint/test conventions.
exclude = ["infra/", "v2/infra/", "fetcher-spikes/", "tests/", "v2/tests/", "build/", "mutants/"]
