# Per-PR security scanning — thin caller of the harness reusable workflow
# (CHG-0024, spec: security-scanning in timothyohare/code-build-harness).
# Scanner config lives there; @main means updates propagate without edits
# here. Suppressions are inline and reviewed: .gitleaksignore /
# .trivyignore.yaml / # nosemgrep — never threshold cuts.
name: security

on:
  pull_request:

permissions:
  contents: read

jobs:
  security:
    uses: timothyohare/code-build-harness/.github/workflows/security-reusable.yml@main
