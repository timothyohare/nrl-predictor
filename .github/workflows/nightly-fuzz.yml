# Nightly API fuzz run (CHG-0029, spec: gate-fuzz). The fuzz gate is
# on-demand for development; this scheduled run is the drift net — new code,
# new schemathesis checks, or dependency updates that break the API contract
# surface here instead of in production. Failure notifies via GitHub's
# scheduled-workflow failure email. Manual trigger: workflow_dispatch.
name: nightly-fuzz

on:
  schedule:
    - cron: "0 17 * * *" # 03:00 AEST — quiet hours
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    # Normal run is ~5 min (pip install dominates); a hung boot or a wedged
    # schemathesis container should fail fast, not burn 6h of runner minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Check out the harness (gate implementation)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: timothyohare/code-build-harness
          path: .harness
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          # No requirements*.txt in this repo — without an explicit path the
          # cache step fails ("no file matched"), taking the whole job with it.
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install into .venv (the binding's interpreter path)
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Run gate-fuzz
        run: node .harness/harness/gates/fuzz.mjs
